services:
  postgres:
    image: postgres:16-alpine
    container_name: tpc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tpc
      POSTGRES_PASSWORD: tpc_dev
      POSTGRES_DB: tpc_painel
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tpc -d tpc_painel']
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-test:
    image: postgres:16-alpine
    container_name: tpc-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: tpc
      POSTGRES_PASSWORD: tpc_test
      POSTGRES_DB: tpc_painel_test
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tpc -d tpc_painel_test']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tpc-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
